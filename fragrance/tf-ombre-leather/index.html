<h1>Ombré Leather by Tom Ford</h1>
<p>Leather fragrance · Signature, Formal</p>
<p>A stark, metallic leather with cool jasmine and cardamom — austere and modern, less animalic than Tuscan Leather.</p>
<h2>Notes</h2>
<p><strong>Top:</strong> Cardamom, Jasmine</p>
<p><strong>Heart:</strong> Leather, Patchouli</p>
<p><strong>Base:</strong> Oakmoss, White Musk</p>
<h2>Projection</h2>
<p>Sillage: 7/10 (powerful (room-filling)). Structure: 5/10.</p>
<h2>Similar Fragrances</h2>
<ul>
<li><strong>Dior Gris Dior</strong> — Chypre, 60% match</li>
<li><strong>Byredo Night Veils: Oud Sans Soucis</strong> — Oud, 56% match</li>
<li><strong>Tom Ford Oud Wood</strong> — Oud, 55% match</li>
<li><strong>Le Labo Santal 33</strong> — Woody, 54% match</li>
<li><strong>Chanel Platinum Égoïste</strong> — Woody, 54% match</li>
</ul>
<h2>Gift This Fragrance</h2>
<p>Know someone who loves leather scents? Ombré Leather makes a bold statement. <a href="https://matthewlew.github.io/scentmap/quiz/gift-intelligence">Take the Gift Intelligence quiz</a> for a personalized recommendation.</p>
